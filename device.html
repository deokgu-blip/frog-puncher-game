<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ribbit Guard · Device</title>
<meta name="theme-color" content="#101114">
<!-- 데스크톱에서 게임(index.html)을 폰 화면 틀 안에 띄우는 보기용 페이지. 폰·태블릿 세로에서 열면 게임으로 바로 넘어간다.
     쿼리(?cheat=1 등)는 그대로 게임에 넘긴다. 게임은 iframe 안에서 폰 해상도(CSS px)로 돌고, 틀 전체를 창 높이에 맞춰 확대·축소한다. -->
<style>
  :root { --bg: #101114; --bg2: #1b1d22; --ink: #e9e6dc; --dim: #9b988f; --line: #2a2d33; --accent: #9ccb45; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 30%, #1d2027 0%, var(--bg) 70%); color: var(--ink);
    font: 500 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .stage { position: fixed; left: 0; right: 0; top: 0; bottom: 64px; display: flex; align-items: center; justify-content: center; } /* 아래 64px = 도구 줄 자리 */
  .phone { position: relative; transform-origin: center center; }
  .body { position: relative; border-radius: 64px; padding: 14px; background: linear-gradient(145deg, #3a3d44, #16181c 45%, #2b2e34);
    box-shadow: 0 0 0 2px #0b0c0e, 0 40px 90px rgba(0, 0, 0, .6), inset 0 0 0 2px rgba(255, 255, 255, .06); }
  .btn-side { position: absolute; width: 4px; border-radius: 2px; background: #2a2d33; }
  .screen { position: relative; overflow: hidden; border-radius: 50px; background: #000; }
  .island { position: absolute; left: 50%; top: 11px; width: 118px; height: 34px; transform: translateX(-50%); border-radius: 20px; background: #000; z-index: 3; pointer-events: none; }
  .hole { position: absolute; left: 50%; top: 10px; width: 13px; height: 13px; transform: translateX(-50%); border-radius: 50%; background: #000; box-shadow: 0 0 0 2px #111; z-index: 3; pointer-events: none; }
  .statusbar { position: absolute; left: 0; right: 0; top: 0; height: var(--sbh, 54px); z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between; padding: 0 34px 0 40px; color: #fff; font: 600 15px/1 system-ui, sans-serif; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
  .statusbar .r { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { display: block; }
  .home { position: absolute; left: 50%; bottom: 9px; width: 134px; height: 5px; transform: translateX(-50%); border-radius: 3px; background: rgba(255, 255, 255, .75); z-index: 3; pointer-events: none; }
  iframe { display: block; border: 0; background: #000; }
  .bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 12px;
    background: rgba(27, 29, 34, .92); border: 1px solid var(--line); backdrop-filter: blur(8px); z-index: 10; }
  .bar button, .bar a, .bar select { appearance: none; border: 1px solid var(--line); background: var(--bg2); color: var(--ink); border-radius: 8px; padding: 7px 10px;
    font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .bar button:hover, .bar a:hover, .bar select:hover { border-color: #3d414a; }
  .bar .on { border-color: var(--accent); color: var(--accent); }
  .bar .sep { width: 1px; height: 20px; background: var(--line); }
  .title { position: fixed; left: 18px; top: 14px; color: var(--dim); font-size: 12px; letter-spacing: .02em; }
  .title b { color: var(--ink); font-weight: 600; }
  @media (max-height: 560px) { .bar { bottom: 6px; } }
</style>
</head>
<body>
<div class="title"><b>Ribbit Guard</b> · 기기 화면 보기</div>
<div class="stage">
  <div class="phone" id="phone">
    <div class="body" id="body">
      <div class="btn-side" style="left:-4px; top:170px; height:34px"></div>
      <div class="btn-side" style="left:-4px; top:230px; height:64px"></div>
      <div class="btn-side" style="left:-4px; top:306px; height:64px"></div>
      <div class="btn-side" style="right:-4px; top:250px; height:100px"></div>
      <div class="screen" id="screen">
        <div class="island" id="island"></div><div class="hole" id="hole"></div>
        <div class="statusbar" id="sb"><span id="clock">9:41</span><span class="r">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#fff"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0z M3.2 6.6a6.8 6.8 0 0 1 9.6 0l-1.2 1.2a5.1 5.1 0 0 0-7.2 0z M.8 4.2a10.2 10.2 0 0 1 14.4 0L14 5.4a8.5 8.5 0 0 0-12 0z" fill="#fff"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="1.8" fill="#fff"/><rect x="23.5" y="4" width="1.6" height="4" rx=".8" fill="#fff" opacity=".5"/></svg>
        </span></div>
        <iframe id="game" title="Ribbit Guard" allow="autoplay; fullscreen; vibrate"></iframe>
        <div class="home" id="homebar"></div>
      </div>
    </div>
  </div>
</div>
<div class="bar">
  <select id="model" title="기기 크기">
    <option value="393x852">iPhone 15 · 393×852</option>
    <option value="430x932">iPhone 15 Pro Max · 430×932</option>
    <option value="360x780">Galaxy S · 360×780</option>
    <option value="412x915">Pixel · 412×915</option>
    <option value="375x667">작은 폰 · 375×667</option>
  </select>
  <span class="sep"></span>
  <button id="reload" title="게임 다시 불러오기">새로고침</button>
  <button id="cheat" title="치트 판 켜기/끄기">치트</button>
  <button id="sbtn" title="실제 폰처럼: 상단 상태바·카메라·하단 홈바 + 그만큼 게임 안전영역(노치 여백) 적용">상태바</button>
  <span class="sep"></span>
  <a id="open" href="./index.html" target="_blank" rel="noopener">게임만 새 창</a>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  // 폰·태블릿 세로(좁은 화면 또는 터치 위주)에서 열면 틀 없이 게임으로
  const narrow = Math.min(innerWidth, screen.width || innerWidth) < 600 || (matchMedia('(pointer: coarse)').matches && innerHeight > innerWidth);
  if (narrow && !q.has('frame')) { location.replace('./index.html' + location.search); return; }
  const $ = (id) => document.getElementById(id);
  const phone = $('phone'), body = $('body'), screenEl = $('screen'), frame = $('game'), sb = $('sb');
  const store = { get(k, d) { try { const v = localStorage.getItem('rg_dev_' + k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('rg_dev_' + k, v); } catch (e) { /* 무시 */ } } };
  let cheat = q.get('cheat') === '1' || store.get('cheat', '0') === '1';
  let showSb = store.get('sb2', '1') === '1'; // 기본 켬 — 실제 폰과 같은 안전영역
  // 기기별 안전영역(CSS px): sat = 상단(상태바·노치) · sab = 하단(홈바) · cam = 카메라 모양
  const SAFE = { '393x852': { sat: 59, sab: 34, cam: 'island' }, '430x932': { sat: 59, sab: 34, cam: 'island' }, '360x780': { sat: 32, sab: 24, cam: 'hole' }, '412x915': { sat: 44, sab: 24, cam: 'hole' }, '375x667': { sat: 20, sab: 0, cam: 'none' } };
  const safe = () => SAFE[model.value] || { sat: 0, sab: 0, cam: 'none' };
  // 게임(같은 출처 iframe)에 안전영역을 넣는다 — 게임 CSS 변수 --sat/--sab(원래 env(safe-area-inset-*))를 덮어쓰고 resize 로 다시 배치
  function applySafe() {
    try {
      const d = frame.contentDocument; if (!d || !d.documentElement) return;
      const S = safe(), r = d.documentElement.style;
      r.setProperty('--sat', (showSb ? S.sat : 0) + 'px'); r.setProperty('--sabraw', (showSb ? S.sab : 0) + 'px'); r.removeProperty('--sab'); // --sab 는 게임이 --sabraw × 비율로 계산(아래 여백 절반만 사용)
      frame.contentWindow.dispatchEvent(new Event('resize'));
    } catch (e) { /* 다른 출처면 못 넣는다 */ }
  }
  let safeTimer = 0;
  function pumpSafe() { clearInterval(safeTimer); let n = 0; applySafe(); safeTimer = setInterval(() => { applySafe(); if (++n > 20) clearInterval(safeTimer); }, 300); } // 게임이 부팅하며 화면을 짜는 동안 몇 번 더
  const model = $('model'); model.value = store.get('model', model.value); if (!model.value) model.selectedIndex = 0;
  function gameURL() { const g = new URLSearchParams(location.search); g.delete('frame'); if (cheat) g.set('cheat', '1'); else g.delete('cheat'); const s = g.toString(); return './index.html' + (s ? '?' + s : ''); }
  function layout() {
    const [w, h] = model.value.split('x').map(Number);
    frame.style.width = w + 'px'; frame.style.height = h + 'px';
    screenEl.style.width = w + 'px'; screenEl.style.height = h + 'px';
    const pw = w + 28, ph = h + 28; // 틀 두께 14px × 2
    const s = Math.min((innerHeight - 64 - 36) / ph, (innerWidth - 40) / pw, 1.6);
    phone.style.transform = `scale(${Math.max(0.3, s)})`;
    phone.style.width = pw + 'px'; phone.style.height = ph + 'px';
  }
  function load() { frame.src = gameURL(); $('open').href = gameURL(); pumpSafe(); }
  frame.addEventListener('load', pumpSafe);
  function paint() { $('cheat').classList.toggle('on', cheat); $('sbtn').classList.toggle('on', showSb); const S = safe(); sb.style.display = showSb && S.sat >= 20 ? 'flex' : 'none'; screenEl.style.setProperty('--sbh', Math.max(20, S.sat) + 'px'); sb.style.padding = S.cam === 'island' ? '0 34px 0 40px' : '0 18px 0 22px'; sb.style.alignItems = S.cam === 'island' ? 'center' : 'flex-start'; sb.style.paddingTop = S.cam === 'island' ? '0' : Math.max(2, (S.sat - 15) / 2) + 'px'; $('island').style.display = showSb && S.cam === 'island' ? 'block' : 'none'; $('hole').style.display = showSb && S.cam === 'hole' ? 'block' : 'none'; $('homebar').style.display = showSb && S.sab > 0 ? 'block' : 'none'; applySafe(); } // 가짜 상태바·카메라 섬은 게임 윗줄(HUD)을 가리므로 기본 끔(iframe 은 안전영역이 0)
  model.addEventListener('change', () => { store.set('model', model.value); layout(); paint(); load(); });
  $('reload').addEventListener('click', load);
  $('cheat').addEventListener('click', () => { cheat = !cheat; store.set('cheat', cheat ? '1' : '0'); paint(); load(); });
  $('sbtn').addEventListener('click', () => { showSb = !showSb; store.set('sb2', showSb ? '1' : '0'); paint(); });
  addEventListener('resize', layout);
  const tick = () => { const d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  tick(); setInterval(tick, 20000);
  layout(); paint(); load();
})();
</script>
</body>
</html>
